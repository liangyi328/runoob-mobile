name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，但不取消进行中的（让生产部署完成）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 校验部署产物完整性，避免部署后白屏才发现缺文件
      - name: Verify deployment artifacts
        run: |
          set -e
          cd docs
          MISSING=0
          for f in index.html app.js styles.css sw.js manifest.webmanifest \
                   data/manifest.json data/python3.json data/numpy.json \
                   data/pandas.json data/matplotlib.json \
                   icons/icon-192.png icons/icon-512.png \
                   vendor/highlight.min.js .nojekyll; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; MISSING=1; else echo "ok  $f"; fi
          done
          if [ "$MISSING" -ne 0 ]; then echo "::error::部署产物缺失"; exit 1; fi
          echo "docs/ 大小: $(du -sh . | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
